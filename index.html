<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warana Dairy Crate Management</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#1f2937}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#e8f5e9,#f8faf9)}
.card{background:white;border-radius:18px;box-shadow:0 8px 30px #00000012;padding:24px}.login-card{width:min(420px,100%);text-align:center}
.logo{width:70px;height:70px;border-radius:18px;background:#2e7d32;color:#fff;display:grid;place-items:center;font-size:32px;margin:0 auto 12px}
h1,h2,h3{margin-top:0}.muted{color:#6b7280}.field{margin:12px 0;text-align:left}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.primary{background:#2e7d32;color:white}.secondary{background:#e8f5e9;color:#256c2b}.danger{background:#fee2e2;color:#b91c1c}.gray{background:#eef2f7}
.app{display:none;min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}
.brand{font-weight:800;color:#2e7d32}.wrap{max-width:1250px;margin:auto;padding:20px}
.nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.nav button{background:#fff;color:#374151;white-space:nowrap}.nav button.active{background:#2e7d32;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px}.stat .num{font-size:28px;font-weight:800;margin-top:7px}
.section{margin-top:18px}.table-wrap{overflow:auto;background:#fff;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:12px;border-bottom:1px solid #edf0f2;text-align:left}.table th{background:#f8faf8;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:999px;background:#e8f5e9;color:#256c2b;font-size:12px;font-weight:bold}
.modal-bg{display:none;position:fixed;inset:0;background:#0007;z-index:20;padding:20px;align-items:center;justify-content:center}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;position:relative}.modal-close{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border-radius:50%;background:#eef2f7;color:#374151;font-size:22px;line-height:34px;display:grid;place-items:center}.modal-close:hover{background:#e5e7eb}
.empty{padding:30px;text-align:center;color:#6b7280}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hidden{display:none!important}
.date-tools{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:end}
@media(max-width:700px){.date-tools{grid-template-columns:1fr 1fr}.date-tools button{width:100%}}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.top{padding:0 12px}.wrap{padding:12px}.stat .num{font-size:22px}}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.grid .card{padding:14px}.nav button{padding:9px 12px}.top .brand{font-size:14px}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="card login-card">
    <div class="logo">🥛</div>
    <h1>Warana Dairy</h1>
    <div class="muted">Crate Management System</div>
    <div class="field"><label>Login as</label>
      <select id="role" onchange="updateLoginFields()"><option value="admin">Admin</option><option value="driver">Driver</option><option value="customer">Customer</option></select>
    </div>
    <div class="field"><label>Username / Mobile</label><input id="username" placeholder="Enter username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter password"></div>
    <button class="primary" style="width:100%" onclick="login()">Login</button>
    <button id="forgotPinBtn" class="secondary" style="width:100%;margin-top:8px" onclick="openDriverPinReset()">Forgot / Reset Driver PIN</button>
    <p class="muted" style="font-size:12px;margin-bottom:0">Driver login: registered vehicle number + 4-digit PIN</p>
  </div>
</div>

<div id="app" class="app">
  <div class="top"><div class="brand">🥛 Warana Dairy Crate Management <span class="pill">v2.1</span></div><div class="actions"><span id="who" class="pill"></span><button class="gray" onclick="logout()">Logout</button></div></div>
  <div class="wrap">
    <div id="nav" class="nav"></div>
    <div id="content"></div>
  </div>
</div>

<div id="modalBg" class="modal-bg"><div class="card modal" id="modal"></div></div>

<script>
const KEY='warana_crate_v2';
const SESSION_KEY='warana_crate_session_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 vehicles:[],
 customers:[],
 tx:[]
};
let session=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db));lastDbSnapshot=localStorage.getItem(KEY)||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}
function showLogin(){document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex'}
function updateLoginFields(){
 const r=document.getElementById('role').value;
 const userLabel=document.querySelector('#username').parentElement.querySelector('label');
 const userInput=document.getElementById('username');
 const passField=document.getElementById('password').parentElement;
 if(r==='driver'){
   userLabel.textContent='Vehicle Number';
   userInput.placeholder='Enter vehicle number, e.g. MH12YQ1051';
   passField.classList.remove('hidden');
   const passLabel=document.querySelector('#password').parentElement.querySelector('label');
   passLabel.textContent='Driver PIN';
   document.getElementById('password').placeholder='Enter 4-digit PIN';
 }else if(r==='customer'){
   userLabel.textContent='Mobile Number';
   document.querySelector('#password').parentElement.querySelector('label').textContent='Password';
   userInput.placeholder='Enter registered mobile number';
   passField.classList.remove('hidden');
 }else{
   userLabel.textContent='Username';
   document.querySelector('#password').parentElement.querySelector('label').textContent='Password';
   userInput.placeholder='Enter username';
   passField.classList.remove('hidden');
 }
}
function login(){
 const r=document.getElementById('role').value;
 const u=document.getElementById('username').value.trim();
 const p=document.getElementById('password').value;

 if(r==='admin'){
   if(u!=='admin' || p!=='admin') return alert('Admin login: admin / admin');
   session={role:'admin',user:null};
 }else if(r==='driver'){
   const entered=normalizeVehicleNo(u);
   const v=db.vehicles.find(x=>normalizeVehicleNo(x.no)===entered);
   if(!v) return alert('Vehicle number not found.');
   if(!v.pin) return alert('Driver PIN is not set for this vehicle. Admin must edit the vehicle and set a PIN.');
   if(String(p).trim()!==String(v.pin)) return alert('Incorrect Driver PIN.');
   session={role:'driver',user:v};
 }else{
   const mobile=String(u).replace(/\D/g,'');
   const c=db.customers.find(x=>String(x.mobile||'').replace(/\D/g,'')===mobile);
   if(!c) return alert('Registered customer mobile number not found.');
   if(p!=='customer') return alert('Customer demo password: customer');
   session={role:'customer',user:c};
 }

 localStorage.setItem(SESSION_KEY,JSON.stringify({role:r,userId:session.user?.id||null}));
 showApp();
 render();
}
function openDriverPinReset(){
 const vehiclePrefill=document.getElementById('role').value==='driver' ? document.getElementById('username').value.trim() : '';
 openModal(`<h3>🔐 Reset Driver PIN</h3>
 <p class="muted">Enter the registered vehicle number. OTP will be sent to the mobile number saved by Admin for that vehicle.</p>
 <div class="field"><label>Vehicle Number</label><input id="resetVehicle" value="${esc(vehiclePrefill)}" placeholder="MH12YQ1051" oninput="this.value=this.value.toUpperCase()"></div>
 <button class="primary" style="width:100%" onclick="sendDriverResetOtp()">Send OTP</button>`);
}
function sendDriverResetOtp(){
 const vehicleNo=normalizeVehicleNo(document.getElementById('resetVehicle').value);
 const v=db.vehicles.find(x=>normalizeVehicleNo(x.no)===vehicleNo);
 if(!v)return alert('Vehicle number not found.');
 if(!v.mobile || !/^\\d{10}$/.test(String(v.mobile)))return alert('Driver mobile number is not registered. Admin must edit this vehicle and add the 10-digit mobile number.');
 const otp=String(Math.floor(100000+Math.random()*900000));
 const otpData={vehicleId:v.id,otp,expires:Date.now()+5*60*1000};
 sessionStorage.setItem('warana_driver_reset_otp',JSON.stringify(otpData));

 openModal(`<h3>📱 OTP Verification</h3>
 <p>OTP sent to mobile ending <b>${esc(String(v.mobile).slice(-4))}</b>.</p>
 <div class="field"><label>Enter OTP</label><input id="resetOtp" type="tel" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"></div>
 <div class="field"><label>New Driver PIN</label><input id="newPin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN"></div>
 <button class="primary" style="width:100%" onclick="verifyDriverResetOtp()">Verify OTP & Reset PIN</button>
 <p class="muted" style="font-size:12px">Demo mode: generated OTP is <b>${otp}</b>. Real SMS OTP requires a backend/SMS provider.</p>`);
}
function verifyDriverResetOtp(){
 const data=JSON.parse(sessionStorage.getItem('warana_driver_reset_otp')||'null');
 const otp=String(document.getElementById('resetOtp').value||'').trim();
 const pin=String(document.getElementById('newPin').value||'').trim();
 if(!data || Date.now()>data.expires)return alert('OTP expired. Please request a new OTP.');
 if(otp!==data.otp)return alert('Incorrect OTP.');
 if(!/^\\d{4}$/.test(pin))return alert('New PIN must be exactly 4 digits.');
 const v=db.vehicles.find(x=>x.id===data.vehicleId);
 if(!v)return alert('Vehicle not found.');
 v.pin=pin;
 save();
 sessionStorage.removeItem('warana_driver_reset_otp');
 closeModal();
 alert('Driver PIN reset successfully. You can now login with the new PIN.');
}
function logout(){session=null;localStorage.removeItem(SESSION_KEY);showLogin()}
function normalizeExistingVehicleNumbers(){
 db.vehicles.forEach(v=>{v.no=normalizeVehicleNo(v.no); if(!v.pin) v.pin='1234'; if(!v.mobile) v.mobile='';});
 localStorage.setItem(KEY,JSON.stringify(db));
}
function restoreSession(){
 try{
   const x=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
   if(!x)return;
   if(x.role==='admin') session={role:'admin',user:null};
   else if(x.role==='driver') { const v=db.vehicles.find(v=>v.id===x.userId); if(v) session={role:'driver',user:v}; else return logout(); }
   else if(x.role==='customer') { const c=db.customers.find(c=>c.id===x.userId); if(c) session={role:'customer',user:c}; else return logout(); }
   showApp(); render();
 }catch(_){localStorage.removeItem(SESSION_KEY)}
}
function setNav(items,active){document.getElementById('nav').innerHTML=items.map(x=>`<button class="${active===x[0]?'active':''}" onclick="page('${x[0]}')">${x[1]}</button>`).join('')}
function render(){
 if(!session)return;
 document.getElementById('who').textContent=session.role.toUpperCase();
 page(session.role==='admin'?'dashboard':session.role==='driver'?'driver':'customer');
}

// Auto-refresh without logging in again. This works between tabs/windows on the same origin.
let lastDbSnapshot=localStorage.getItem(KEY)||'';
window.addEventListener('storage',refreshFromStorage);
setInterval(refreshFromStorage,2000);
function refreshFromStorage(){
  const raw=localStorage.getItem(KEY)||'';
  if(raw===lastDbSnapshot || !raw)return;
  lastDbSnapshot=raw;
  try{db=JSON.parse(raw)||{vehicles:[],customers:[],tx:[]};}catch(_){return;}
  if(!session)return;
  if(session.role==='driver'){
    const v=db.vehicles.find(v=>v.id===session.user?.id);
    if(v) session.user=v;
  }else if(session.role==='customer'){
    const c=db.customers.find(c=>c.id===session.user?.id);
    if(c) session.user=c;
  }
  render();
}
function totalsVehicle(v){
 let out=db.tx.filter(t=>t.vehicleId===v.id&&t.type==='out').reduce((a,t)=>a+t.qty,0);
 let ret=db.tx.filter(t=>t.vehicleId===v.id&&t.type==='return').reduce((a,t)=>a+t.qty,0);
 return {out,ret,current:v.assigned-out+ret};
}
function customerTotals(c,vehicleId=null){
 let a=db.tx.filter(t=>t.customerId===c.id&&(!vehicleId||t.vehicleId===vehicleId));
 let out=a.filter(t=>t.type==='out').reduce((x,t)=>x+t.qty,0),ret=a.filter(t=>t.type==='return').reduce((x,t)=>x+t.qty,0);
 return {out,ret,pending:out-ret};
}
function page(p){
 if(session.role==='admin') adminPage(p); else if(session.role==='driver') driverPage(p); else customerPage(p);
}
function adminPage(p){
 setNav([['dashboard','📊 Dashboard'],['vehicles','🚚 Vehicles'],['customers','👥 Customers'],['history','📜 History']],p);
 if(p==='dashboard') adminDashboard(); if(p==='vehicles') vehiclesPage(); if(p==='customers') customersPage(); if(p==='history') historyPage();
}
function adminDashboard(){
 let total=db.vehicles.reduce((a,v)=>a+v.assigned,0),out=db.tx.filter(t=>t.type==='out').reduce((a,t)=>a+t.qty,0),ret=db.tx.filter(t=>t.type==='return').reduce((a,t)=>a+t.qty,0);
 document.getElementById('content').innerHTML=`<h2>Admin Dashboard</h2><div class="grid">
 <div class="card stat"><div class="muted">Total Crates Assigned</div><div class="num">${total}</div></div>
 <div class="card stat"><div class="muted">Total Out</div><div class="num">${out}</div></div>
 <div class="card stat"><div class="muted">Total Returned</div><div class="num">${ret}</div></div>
 <div class="card stat"><div class="muted">Pending With Customers</div><div class="num">${out-ret}</div></div></div>
 <div class="section card"><h3>Vehicle-wise Crates</h3>${vehicleTable()}</div>`;
}
function normalizeVehicleNo(value){
 return String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
}
function isValidVehicleNo(value){
 const n=normalizeVehicleNo(value);
 return /^[A-Z]{2}\d{1,2}[A-Z]{1,3}\d{1,4}$/.test(n);
}
function vehicleSearchMatch(v, query){
 const q=String(query||'').trim().toUpperCase();
 if(!q) return true;
 const compactQ=normalizeVehicleNo(q);
 return normalizeVehicleNo(v.no).includes(compactQ) ||
        String(v.transport||'').toUpperCase().includes(q) ||
        String(v.driver||'').toUpperCase().includes(q);
}
function filteredVehicles(){
 const q=document.getElementById('vehicleSearch')?.value||'';
 return db.vehicles.filter(v=>vehicleSearchMatch(v,q));
}
function vehicleTable(){
 const list=filteredVehicles();
 return `<div class="field" style="margin:0 0 14px">
   <label>Search Vehicle</label>
   <input id="vehicleSearch" value="${esc(document.getElementById('vehicleSearch')?.value||'')}" oninput="vehicleSearchChanged()" placeholder="Enter full number or last digits, e.g. 1051">
 </div>
 <div class="muted" style="font-size:12px;margin:-5px 0 10px">Example: Vehicle <b>MH12YQ1051</b> can be found by searching <b>1051</b>.</div>
 <div class="table-wrap"><table class="table"><tr><th>Transport Name</th><th>Vehicle Number</th><th>Driver</th><th>Assigned</th><th>Out</th><th>Return</th><th>Current</th><th>Action</th></tr>${list.map(v=>{let x=totalsVehicle(v);return `<tr><td><b>${esc(v.transport||'Warana Transport')}</b></td><td><b>${esc(v.no)}</b></td><td>${esc(v.driver)}</td><td>${v.assigned}</td><td>${x.out}</td><td>${x.ret}</td><td><b>${x.current}</b></td><td><div class="actions"><button class="primary" onclick="addCratesModal(${v.id})">+ Crates</button><button class="secondary" onclick="vehicleModal(db.vehicles.find(x=>x.id===${v.id}))">Edit</button><button class="danger" onclick="deleteVehicle(${v.id})">Delete</button></div></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">No matching vehicles</td></tr>'}</table></div>`;
}
function vehicleSearchChanged(){
 const input=document.getElementById('vehicleSearch');
 const value=input?input.value:'';
 const pos=input?input.selectionStart:null;
 const scroll=window.scrollY;
 vehiclesPage(value);
 window.scrollTo(0,scroll);
 const ni=document.getElementById('vehicleSearch');
 if(ni){
   ni.focus();
   try{ni.setSelectionRange(pos,pos)}catch(e){}
 }
}
function vehiclesPage(searchValue=''){
 document.getElementById('content').innerHTML=`<div class="actions" style="justify-content:space-between"><h2>Vehicle Management</h2><button class="primary" onclick="vehicleModal()">+ Add Vehicle</button></div>
 <div class="section card">${vehicleTable()}</div>`;
 const si=document.getElementById('vehicleSearch');
 if(si && searchValue) si.value=searchValue;
}
function vehicleModal(v=null){
 openModal(`<h3>${v?'Edit':'Add'} Vehicle</h3>
 <div class="field"><label>Transport Name</label><input id="mTransport" value="${esc(v?.transport||'Warana Transport')}" placeholder="Enter transport name"></div>
 <div class="field"><label>Vehicle Number</label><input id="mNo" value="${esc(v?.no||'')}" maxlength="12" placeholder="MH12YQ1051" oninput="this.value=this.value.toUpperCase()"></div>
 <div class="field"><label>Driver Name</label><input id="mDriver" value="${esc(v?.driver||'')}"></div>
 <div class="field"><label>Driver Mobile Number</label><input id="mMobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" value="${esc(v?.mobile||'')}"></div>
 <div class="field"><label>Driver PIN (4 digits)</label><input id="mPin" type="password" inputmode="numeric" maxlength="4" placeholder="Example: 1234" value="${esc(v?.pin||'')}"></div>
 <div class="field"><label>Initial Assigned Crates</label><input id="mCrates" type="number" min="0" value="${v?.assigned||0}"></div>
 <div class="actions"><button class="primary" onclick="saveVehicle(${v?.id||0})">Save</button><button class="gray" onclick="closeModal()">Cancel</button></div>`);
}
function saveVehicle(id){
 let transport=document.getElementById('mTransport').value.trim();
 let rawNo=document.getElementById('mNo').value.trim();
 let no=normalizeVehicleNo(rawNo);
 let driver=document.getElementById('mDriver').value.trim();
 let mobile=String(document.getElementById('mMobile').value||'').replace(/\D/g,'');
 let pin=String(document.getElementById('mPin').value||'').trim();
 let assigned=+document.getElementById('mCrates').value||0;
 if(!transport||!no||!driver||!mobile||!pin)return alert('Enter transport name, vehicle number, driver name, mobile number and 4-digit PIN');
 if(!/^\d{10}$/.test(mobile))return alert('Driver mobile number must be exactly 10 digits.');
 if(!/^\d{4}$/.test(pin))return alert('Driver PIN must be exactly 4 digits.');
 if(!isValidVehicleNo(no))return alert('Enter a valid full vehicle number, for example MH12YQ1051.');
 const duplicate=db.vehicles.find(x=>normalizeVehicleNo(x.no)===no && x.id!==id);
 if(duplicate)return alert('This vehicle number is already added: '+duplicate.no);
 if(id){
   let v=db.vehicles.find(x=>x.id===id); if(!v)return;
   let out=db.tx.filter(t=>t.vehicleId===id&&t.type==='out').reduce((a,t)=>a+t.qty,0), ret=db.tx.filter(t=>t.vehicleId===id&&t.type==='return').reduce((a,t)=>a+t.qty,0);
   if(assigned + ret < out)return alert('Assigned crates cannot be less than crates already given out.');
   Object.assign(v,{transport,no,driver,mobile,pin,assigned});
 }else db.vehicles.push({id:Date.now(),transport,no,driver,mobile,pin,assigned});
 save();lastDbSnapshot=localStorage.getItem(KEY)||'';closeModal();vehiclesPage();
}
function addCratesModal(vehicleId){
 const v=db.vehicles.find(x=>x.id===vehicleId); if(!v)return;
 openModal(`<h3>➕ Add Crates - ${esc(v.no)}</h3><div class="muted" style="margin-bottom:12px">Transport: ${esc(v.transport||'Warana Transport')}</div><div class="field"><label>Crates to Add</label><input id="addQty" type="number" min="1" step="1" placeholder="Enter crates"></div><div class="actions"><button class="primary" onclick="addCrates(${vehicleId})">Add Crates</button><button class="gray" onclick="closeModal()">Cancel</button></div>`);
}
function addCrates(vehicleId){
 const qty=Number(document.getElementById('addQty').value); if(!qty||qty<=0)return alert('Enter a valid crate quantity.');
 const v=db.vehicles.find(x=>x.id===vehicleId); if(!v)return;
 v.assigned += qty;
 save(); lastDbSnapshot=localStorage.getItem(KEY)||''; closeModal(); vehiclesPage();
}
function deleteVehicle(id){
 const v=db.vehicles.find(x=>x.id===id); if(!v)return;
 if(db.tx.some(t=>t.vehicleId===id))return alert('This vehicle has transaction entries. Delete/edit those entries first.');
 if(!confirm(`Delete vehicle ${v.no}?`))return;
 db.vehicles=db.vehicles.filter(x=>x.id!==id);save();lastDbSnapshot=localStorage.getItem(KEY)||'';vehiclesPage();
}
function customersPage(){
 document.getElementById('content').innerHTML=`<div class="actions" style="justify-content:space-between"><h2>Customer Management</h2><button class="primary" onclick="customerModal()">+ Add Customer</button></div>
 <div class="section card"><div class="table-wrap"><table class="table"><tr><th>Customer</th><th>Mobile</th><th>Received</th><th>Returned</th><th>Pending</th><th>Action</th></tr>${db.customers.map(c=>{let x=customerTotals(c);return `<tr><td>${esc(c.name)}</td><td>${esc(c.mobile)}</td><td>${x.out}</td><td>${x.ret}</td><td><b>${x.pending}</b></td><td><div class="actions"><button class="secondary" onclick="customerDetails(${c.id})">View</button><button class="gray" onclick="customerModal(db.customers.find(x=>x.id===${c.id}))">Edit</button><button class="danger" onclick="deleteCustomer(${c.id})">Delete</button></div></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No customers added</td></tr>'}</table></div></div>`;
}
function deleteCustomer(id){
 const c=db.customers.find(x=>x.id===id); if(!c)return;
 if(db.tx.some(t=>t.customerId===id))return alert('This customer has transaction entries. Delete/edit those entries first.');
 if(!confirm(`Delete customer ${c.name}?`))return;
 db.customers=db.customers.filter(x=>x.id!==id);save();lastDbSnapshot=localStorage.getItem(KEY)||'';customersPage();
}
function customerModal(c=null){
 openModal(`<h3>${c?'Edit':'Add'} Customer</h3><div class="field"><label>Customer Name</label><input id="cName" value="${esc(c?.name||'')}"></div><div class="field"><label>Mobile</label><input id="cMobile" value="${esc(c?.mobile||'')}"></div><div class="actions"><button class="primary" onclick="saveCustomer(${c?.id||0})">Save</button><button class="gray" onclick="closeModal()">Cancel</button></div>`);
}
function saveCustomer(id){let name=document.getElementById('cName').value.trim(),mobile=document.getElementById('cMobile').value.trim();if(!name)return alert('Enter customer name');if(id)Object.assign(db.customers.find(x=>x.id===id),{name,mobile});else db.customers.push({id:Date.now(),name,mobile});save();closeModal();customersPage()}
function todayISO(){
 const d=new Date();
 const m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
 return `${d.getFullYear()}-${m}-${day}`;
}
function txLocalDate(t){
 const d=new Date(t.time);
 const m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
 return `${d.getFullYear()}-${m}-${day}`;
}
function txDateInRange(t,from,to){
 const d=txLocalDate(t);
 return (!from||d>=from)&&(!to||d<=to);
}
function historyPage(from=todayISO(),to=todayISO()){
 const all=db.tx.slice().reverse();
 const rows=all.filter(t=>txDateInRange(t,from,to));
 const out=rows.filter(t=>t.type==='out').reduce((a,t)=>a+t.qty,0);
 const ret=rows.filter(t=>t.type==='return').reduce((a,t)=>a+t.qty,0);
 document.getElementById('content').innerHTML=`
 <div class="actions" style="justify-content:space-between"><h2>📜 Date-wise Crate Entries</h2><button class="primary" onclick="adminEntryModal()">+ Add Entry</button></div>
 <div class="card section">
  <div class="date-tools">
   <div class="field" style="margin:0"><label>From Date</label><input id="historyFrom" type="date" value="${esc(from)}"></div>
   <div class="field" style="margin:0"><label>To Date</label><input id="historyTo" type="date" value="${esc(to)}"></div>
   <button class="primary" onclick="applyHistoryFilter()">🔎 Search</button>
   <button class="gray" onclick="historyPage(todayISO(),todayISO())">Today</button>
  </div>
 </div>
 <div class="grid section">
  <div class="card stat"><div class="muted">Entries</div><div class="num">${rows.length}</div></div>
  <div class="card stat"><div class="muted">Crate Out</div><div class="num">${out}</div></div>
  <div class="card stat"><div class="muted">Crate Return</div><div class="num">${ret}</div></div>
  <div class="card stat"><div class="muted">Net Pending</div><div class="num">${out-ret}</div></div>
 </div>
 <div class="section card"><h3>${from===to?'Entries for '+esc(from):'Entries from '+esc(from)+' to '+esc(to)}</h3>
 <div class="table-wrap"><table class="table"><tr><th>Date/Time</th><th>Transport</th><th>Vehicle</th><th>Driver</th><th>Customer</th><th>Type</th><th>Qty</th><th>Action</th></tr>
 ${rows.map(t=>{let v=db.vehicles.find(v=>v.id===t.vehicleId),c=db.customers.find(c=>c.id===t.customerId);return `<tr><td>${new Date(t.time).toLocaleString()}</td><td>${esc(v?.transport||'Warana Transport')}</td><td><b>${esc(v?.no||'-')}</b></td><td>${esc(v?.driver||'-')}</td><td>${esc(c?.name||'-')}</td><td><span class="pill">${t.type.toUpperCase()}</span></td><td>${t.qty}</td><td><div class="actions"><button class="gray" onclick="editTxModal(${t.id})">Edit</button><button class="danger" onclick="deleteTx(${t.id})">Delete</button></div></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">No entries for selected date.</td></tr>'}
 </table></div></div>`;
}
function applyHistoryFilter(){
 const from=document.getElementById('historyFrom')?.value||'';
 const to=document.getElementById('historyTo')?.value||'';
 if(from&&to&&from>to)return alert('From Date cannot be after To Date.');
 historyPage(from,to);
}
function localDateTimeValue(iso){
 const d=new Date(iso||Date.now());
 const pad=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function adminEntryModal(id=0){
 const t=id?db.tx.find(x=>x.id===id):null;
 const type=t?.type||'out', vehicleId=t?.vehicleId||db.vehicles[0]?.id||'', customerId=t?.customerId||db.customers[0]?.id||'';
 openModal(`<h3>${id?'✏️ Edit':'➕ Add'} Crate Entry</h3>
 <div class="field"><label>Vehicle</label><select id="adminVehicle">${db.vehicles.map(v=>`<option value="${v.id}" ${String(vehicleId)===String(v.id)?'selected':''}>${esc(v.transport||'Warana Transport')} - ${esc(v.no)} - ${esc(v.driver)}</option>`).join('')}</select></div>
 <div class="field"><label>Customer</label><select id="adminCustomer">${db.customers.map(c=>`<option value="${c.id}" ${String(customerId)===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Entry Type</label><select id="adminType"><option value="out" ${type==='out'?'selected':''}>Crate Out</option><option value="return" ${type==='return'?'selected':''}>Crate Return</option></select></div>
 <div class="field"><label>Crate Quantity</label><input id="adminQty" type="number" min="1" step="1" value="${t?.qty||''}" placeholder="Enter crates"></div>
 <div class="field"><label>Date & Time</label><input id="adminDateTime" type="datetime-local" value="${localDateTimeValue(t?.time)}"></div>
 <div class="actions"><button class="primary" onclick="saveAdminEntry(${id})">Save</button><button class="gray" onclick="closeModal()">Cancel</button></div>`);
}
function saveAdminEntry(id){
 const vehicleId=Number(document.getElementById('adminVehicle').value);
 const customerId=Number(document.getElementById('adminCustomer').value);
 const type=document.getElementById('adminType').value;
 const qty=Number(document.getElementById('adminQty').value);
 const dt=document.getElementById('adminDateTime').value;
 if(!vehicleId||!customerId||!qty||qty<=0||!dt)return alert('Please fill all entry details.');
 const time=new Date(dt).toISOString();
 if(id){
   const original=db.tx.find(t=>t.id===id); if(!original)return alert('Entry not found.');
   const candidate=db.tx.map(t=>t.id===id?{...t,vehicleId,customerId,type,qty,time}:t);
   const check=validateAllTransactions(candidate);
   if(!check.ok)return alert(check.msg);
   db.tx=candidate;
 }else{
   const candidate=[...db.tx,{id:Date.now(),vehicleId,customerId,type,qty,time}];
   const check=validateAllTransactions(candidate);
   if(!check.ok)return alert(check.msg);
   db.tx=candidate;
 }
 save();closeModal();historyPage(txLocalDate({time}),txLocalDate({time}));
}
function validateAllTransactions(txList){
 for(const v of db.vehicles){
   const out=txList.filter(t=>t.vehicleId===v.id&&t.type==='out').reduce((a,t)=>a+t.qty,0);
   const ret=txList.filter(t=>t.vehicleId===v.id&&t.type==='return').reduce((a,t)=>a+t.qty,0);
   if(out>v.assigned+ret)return {ok:false,msg:`Vehicle ${v.no} would have negative crate balance.`};
 }
 for(const c of db.customers){
   const out=txList.filter(t=>t.customerId===c.id&&t.type==='out').reduce((a,t)=>a+t.qty,0);
   const ret=txList.filter(t=>t.customerId===c.id&&t.type==='return').reduce((a,t)=>a+t.qty,0);
   if(ret>out)return {ok:false,msg:`${c.name} would have negative pending crates.`};
 }
 return {ok:true};
}
function txTotalsAfterChange(txList, vehicleId){
 const out=txList.filter(t=>t.vehicleId===vehicleId&&t.type==='out').reduce((a,t)=>a+t.qty,0);
 const ret=txList.filter(t=>t.vehicleId===vehicleId&&t.type==='return').reduce((a,t)=>a+t.qty,0);
 return {out,ret};
}
function validateTxList(txList, txId, newType, newQty){
 const candidate=txList.map(t=>t.id===txId?{...t,type:newType,qty:newQty}:t);
 const t0=txList.find(t=>t.id===txId); if(!t0)return {ok:false,msg:'Entry not found.'};
 const v=db.vehicles.find(v=>v.id===t0.vehicleId); if(!v)return {ok:false,msg:'Vehicle not found.'};
 const vt=txTotalsAfterChange(candidate,t0.vehicleId);
 if(vt.out>v.assigned+vt.ret)return {ok:false,msg:'This edit would make vehicle crates negative.'};
 for(const c of db.customers){
   const out=candidate.filter(t=>t.customerId===c.id&&t.type==='out').reduce((a,t)=>a+t.qty,0);
   const ret=candidate.filter(t=>t.customerId===c.id&&t.type==='return').reduce((a,t)=>a+t.qty,0);
   if(ret>out)return {ok:false,msg:`${c.name} would have negative pending crates.`};
 }
 return {ok:true,candidate};
}
function editTxModal(id){ if(session?.role==='admin'){ adminEntryModal(id); return; } const t=db.tx.find(x=>x.id===id);if(!t)return; openModal(`<h3>✏️ Edit Crate Entry</h3><div class="field"><label>Type</label><select id="editType"><option value="out" ${t.type==='out'?'selected':''}>Crate Out</option><option value="return" ${t.type==='return'?'selected':''}>Crate Return</option></select></div><div class="field"><label>Quantity</label><input id="editQty" type="number" min="1" value="${t.qty}"></div><div class="actions"><button class="primary" onclick="saveEditedTx(${id})">Save</button><button class="gray" onclick="closeModal()">Cancel</button></div>`); }
function saveEditedTx(id){
 const newType=document.getElementById('editType').value,newQty=Number(document.getElementById('editQty').value);
 if(!newQty||newQty<=0)return alert('Enter a valid quantity.');
 const check=validateTxList(db.tx,id,newType,newQty);if(!check.ok)return alert(check.msg);
 db.tx=check.candidate;save();closeModal();historyPage(todayISO(),todayISO());
}
function deleteTx(id){
 const t=db.tx.find(x=>x.id===id);if(!t)return;
 if(!confirm(`Delete this ${t.type} entry of ${t.qty} crates?`))return;
 const candidate=db.tx.filter(x=>x.id!==id);
 const v=db.vehicles.find(v=>v.id===t.vehicleId);
 if(!v)return alert('Vehicle not found.');
 const vt=txTotalsAfterChange(candidate,t.vehicleId);
 if(vt.out>v.assigned+vt.ret)return alert('Cannot delete: vehicle crate balance would become invalid.');
 for(const c of db.customers){
   const out=candidate.filter(x=>x.customerId===c.id&&x.type==='out').reduce((a,x)=>a+x.qty,0);
   const ret=candidate.filter(x=>x.customerId===c.id&&x.type==='return').reduce((a,x)=>a+x.qty,0);
   if(ret>out)return alert(`Cannot delete: ${c.name} would have negative pending crates.`);
 }
 db.tx=candidate;save();historyPage(todayISO(),todayISO());
}
function driverPage(p){
 let v=session.user;setNav([['driver','🚚 My Vehicle'],['customers','👥 Customers'],['history','📜 History']],p);
 if(p==='driver') driverDashboard(v);if(p==='customers') driverCustomers(v);if(p==='history') driverHistory(v);
}
function driverDashboard(v){
 let x=totalsVehicle(v), rows=db.customers.map(c=>({c,x:customerTotals(c,v.id)})).filter(z=>z.x.out||z.x.ret);
 document.getElementById('content').innerHTML=`<h2>${esc(v.transport||'Warana Transport')} - ${esc(v.no)}</h2><div class="grid">
 <div class="card stat"><div class="muted">Total Assigned</div><div class="num">${v.assigned}</div></div><div class="card stat"><div class="muted">Total Out</div><div class="num">${x.out}</div></div><div class="card stat"><div class="muted">Returned</div><div class="num">${x.ret}</div></div><div class="card stat"><div class="muted">Current In Vehicle</div><div class="num">${x.current}</div></div></div>
 <div class="section actions"><button class="primary" onclick="txModal('out',${v.id})">📤 CRATE OUT</button><button class="secondary" onclick="txModal('return',${v.id})">📥 CRATE RETURN</button></div>
 <div class="section card"><h3>Customer-wise Crate Account</h3>${customerTable(v.id)}</div>`;
}
function customerTable(vehicleId){
 return `<div class="table-wrap"><table class="table"><tr><th>Customer</th><th>Given</th><th>Returned</th><th>Pending</th></tr>${db.customers.map(c=>{let x=customerTotals(c,vehicleId);return `<tr><td>${esc(c.name)}</td><td>${x.out}</td><td>${x.ret}</td><td><b>${x.pending}</b></td></tr>`}).join('')}</table></div>`;
}
function driverCustomers(v){document.getElementById('content').innerHTML=`<h2>${esc(v.transport||'Warana Transport')} - ${esc(v.no)}</h2><div class="muted" style="margin:-8px 0 14px">Driver: ${esc(v.driver)}</div><div class="card">${customerTable(v.id)}</div>`}
function driverHistory(v){
 let rows=db.tx.filter(t=>t.vehicleId===v.id).reverse();document.getElementById('content').innerHTML=`<h2>${esc(v.transport||'Warana Transport')} - ${esc(v.no)} History</h2><div class="card table-wrap"><table class="table"><tr><th>Date/Time</th><th>Customer</th><th>Type</th><th>Qty</th></tr>${rows.map(t=>`<tr><td>${new Date(t.time).toLocaleString()}</td><td>${esc(db.customers.find(c=>c.id===t.customerId)?.name||'-')}</td><td>${t.type.toUpperCase()}</td><td>${t.qty}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No transactions</td></tr>'}</table></div>`;
}
function txModal(type,vehicleId){
 let v=db.vehicles.find(x=>x.id===vehicleId);
 let options=db.customers.map(c=>{
   let pending=customerTotals(c,vehicleId).pending;
   return `<option value="${c.id}">${esc(c.name)}${type==='return'?' - Pending: '+pending:''}</option>`;
 }).join('');
 openModal(`<h3>${type==='out'?'📤 Crate Out':'📥 Crate Return'}</h3>
 <div class="field"><label>Customer</label><select id="txCustomer">${options}</select></div>
 <div class="field"><label>${type==='return'?'Returned Crates':'Crates to Give'}</label><input id="txQty" type="number" min="1" step="1" placeholder="Enter crates"></div>
 <button class="primary" style="width:100%" onclick="saveTx('${type}',${vehicleId})">Submit</button>`);
}
function saveTx(type,vehicleId){
 let customerId=+document.getElementById('txCustomer').value;
 let qty=Number(document.getElementById('txQty').value);
 if(!qty || qty<=0){ alert('Please enter a valid crate quantity.'); return; }

 let v=db.vehicles.find(x=>x.id===vehicleId);
 let customer=db.customers.find(x=>x.id===customerId);
 let vehicleBal=totalsVehicle(v).current;
 let c=customerTotals(customer,vehicleId);

 if(type==='out'){
   if(qty>vehicleBal){
     alert('Not enough crates in vehicle. Current available crates: '+vehicleBal);
     return;
   }
 }else{
   if(c.pending<=0){
     alert(customer.name+' has no pending crates for this vehicle.');
     return;
   }
   if(qty>c.pending){
     alert('Return quantity cannot exceed '+c.pending+' pending crates for '+customer.name+'.');
     return;
   }
 }

 db.tx.push({
   id:Date.now(),
   vehicleId:vehicleId,
   customerId:customerId,
   type:type,
   qty:qty,
   time:new Date().toISOString()
 });
 save();
 closeModal();
 if(session.role==='driver') driverDashboard(v);
 else render();
}
function customerPage(p){
 let c=session.user;setNav([['customer','👤 My Crates'],['history','📜 History']],p);if(p==='customer') customerDashboard(c);else customerHistory(c);
}
function customerDashboard(c){
 let x=customerTotals(c);document.getElementById('content').innerHTML=`<h2>${esc(c.name)}</h2><div class="muted" style="margin:-8px 0 14px">Customer Crate Account</div><div class="grid"><div class="card stat"><div class="muted">Total Crates Received</div><div class="num">${x.out}</div></div><div class="card stat"><div class="muted">Total Returned</div><div class="num">${x.ret}</div></div><div class="card stat"><div class="muted">Pending Crates</div><div class="num">${x.pending}</div></div><div class="card stat"><div class="muted">Account Status</div><div class="num" style="font-size:20px">${x.pending?'Pending':'Clear'}</div></div></div><div class="section card"><h3>Vehicle-wise Received / Pending</h3><div class="table-wrap"><table class="table"><tr><th>Transport Name</th><th>Vehicle Number</th><th>Driver</th><th>Received</th><th>Returned</th><th>Pending</th></tr>${db.vehicles.map(v=>{let z=customerTotals(c,v.id);return `<tr><td>${esc(v.transport||'Warana Transport')}</td><td>${esc(v.no)}</td><td>${esc(v.driver)}</td><td>${z.out}</td><td>${z.ret}</td><td><b>${z.pending}</b></td></tr>`}).join('')}</table></div></div>`;
}
function customerHistory(c){
 let rows=db.tx.filter(t=>t.customerId===c.id).reverse();document.getElementById('content').innerHTML=`<h2>My Crate History</h2><div class="card table-wrap"><table class="table"><tr><th>Date/Time</th><th>Transport Name</th><th>Vehicle Number</th><th>Driver</th><th>Type</th><th>Qty</th></tr>${rows.map(t=>{let v=db.vehicles.find(v=>v.id===t.vehicleId);return `<tr><td>${new Date(t.time).toLocaleString()}</td><td>${esc(v?.transport||'Warana Transport')}</td><td>${esc(v?.no||'-')}</td><td>${esc(v?.driver||'-')}</td><td>${t.type.toUpperCase()}</td><td>${t.qty}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No history</td></tr>'||'<tr><td colspan="5" class="empty">No history</td></tr>'}</table></div>`;
}
function customerDetails(id){let c=db.customers.find(x=>x.id===id),x=customerTotals(c);openModal(`<h3>${esc(c.name)}</h3><div class="grid"><div class="card"><b>${x.out}</b><br><span class="muted">Received</span></div><div class="card"><b>${x.ret}</b><br><span class="muted">Returned</span></div><div class="card"><b>${x.pending}</b><br><span class="muted">Pending</span></div></div><div class="actions" style="margin-top:15px"><button class="gray" onclick="closeModal()">Close</button></div>`)}
function openModal(x){document.getElementById('modal').innerHTML=`<button class="modal-close" aria-label="Close" title="Close" onclick="closeModal()">×</button>${x}`;document.getElementById('modalBg').style.display='flex'}
function closeModal(){document.getElementById('modalBg').style.display='none'}
normalizeExistingVehicleNumbers();
restoreSession();
updateLoginFields();
</script>
</body>
</html>
